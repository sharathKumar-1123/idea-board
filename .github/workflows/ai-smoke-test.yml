name: AI smoke test

# Quick check that the configured AI provider answers with a valid verdict, without deploying anything.
on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Provider to test"
        type: choice
        options: [github, bedrock]
        default: github

permissions:
  contents: read
  id-token: write
  models: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        if: inputs.provider == 'bedrock'
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ask the AI to judge a sample (broken) deployment
        working-directory: scripts/ai
        env:
          AI_PROVIDER: ${{ inputs.provider }}
          BEDROCK_MODEL_ID: ${{ vars.BEDROCK_MODEL_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install -q -r requirements.txt
          python - <<'EOF'
          from pathlib import Path
          import ai_client, json, sys

          evidence = {
              "pods": [{"name": "idea-board-backend-abc", "component": "backend", "phase": "Running",
                        "ready": False, "restarts": 4, "waiting_reasons": ["CrashLoopBackOff"]}],
              "events": ["Warning BackOff pod/idea-board-backend-abc Back-off restarting failed container"],
              "backend_logs": ["WARNING database not ready (attempt 10/10): could not translate host name "
                               "\"db.invalid.example\" to address: Name or service not known"],
              "http_probes": [{"url": "http://example/api/health", "status": 503, "ok": False, "error": ""}],
              "hard_check_problems": ["Pod idea-board-backend-abc is in CrashLoopBackOff."],
          }
          verdict = ai_client.analyze((Path("prompt.md")).read_text(), evidence)
          print(json.dumps(verdict, indent=2))
          sys.exit(0 if verdict else 1)
          EOF
