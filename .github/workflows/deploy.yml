name: Deploy

# Releases the application onto the platform created by the Infra workflow, then runs the AI health gate.
# Runs after CI succeeds on main, or manually (with optional chaos to demo the AI rollback).
# It never changes infrastructure: Terraform is only read here, for the cluster connection.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (commit SHA). Empty = current commit."
        required: false
        default: ""
      chaos:
        description: "Inject a failure to demo AI health check + rollback"
        type: choice
        options: [none, bad-db, bad-image]
        default: none

permissions:
  contents: read
  id-token: write # OIDC: exchange GitHub's identity token for short-lived AWS credentials

# Shared with Infra and Destroy so they never change the environment at the same time.
concurrency:
  group: aws-platform
  cancel-in-progress: false

env:
  CLOUD: aws
  AWS_REGION: us-east-1
  TF_DIR: infra/envs/aws
  RELEASE: idea-board
  NAMESPACE: idea-board
  CHART: deploy/helm/idea-board
  AI_PROVIDER: ${{ vars.AI_PROVIDER || 'ollama' }}
  OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || 'qwen2.5:3b' }}

jobs:
  deploy:
    # Skipped until the AWS bootstrap has been applied and AWS_ROLE_ARN is configured.
    if: >-
      vars.AWS_ROLE_ARN != '' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve image tag
        run: echo "IMAGE_TAG=${{ inputs.image_tag || github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_ENV"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: idea-board-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      # ---------- Platform lookup (read-only) ----------
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Check the platform exists
        id: platform
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${AWS_REGION}" > /dev/null
          if CMD="$(terraform output -raw kubeconfig_command 2>/dev/null)" && [ -n "$CMD" ]; then
            echo "KUBECONFIG_CMD=$CMD" >> "$GITHUB_ENV"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No platform found. Run the Infra workflow (action: apply) first; skipping this deploy."
            echo "### ⏭️ Skipped: platform not provisioned. Run **Infra → apply** first." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      # ---------- Application ----------
      - uses: azure/setup-helm@v4
        if: steps.platform.outputs.ready == 'true'

      - name: Connect to cluster
        if: steps.platform.outputs.ready == 'true'
        run: $KUBECONFIG_CMD

      - name: Helm upgrade
        id: helm
        if: steps.platform.outputs.ready == 'true'
        continue-on-error: true # the health gate below decides what happens next
        run: |
          EXTRA=()
          case "${{ inputs.chaos || 'none' }}" in
            bad-db)    EXTRA+=(--set database.hostOverride=db.invalid.example) ;;
            bad-image) EXTRA+=(--set backend.image.tag=does-not-exist) ;;
          esac
          helm upgrade --install "$RELEASE" "$CHART" -n "$NAMESPACE" \
            -f "$CHART/values-$CLOUD.yaml" \
            --set backend.image.tag="$IMAGE_TAG" \
            --set frontend.image.tag="$IMAGE_TAG" \
            "${EXTRA[@]}" \
            --wait --timeout 4m

      - name: Resolve public URL
        if: steps.platform.outputs.ready == 'true'
        run: |
          for _ in $(seq 1 30); do
            HOST="$(kubectl get svc ingress-nginx-controller -n ingress-nginx \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}{.status.loadBalancer.ingress[0].ip}')"
            [ -n "$HOST" ] && break
            sleep 10
          done
          echo "APP_URL=http://$HOST" >> "$GITHUB_ENV"
          echo "Application URL: http://$HOST"

      # ---------- AI health gate ----------
      - uses: actions/setup-python@v5
        if: steps.platform.outputs.ready == 'true'
        with:
          python-version: "3.12"

      - name: Set up self-hosted LLM
        if: steps.platform.outputs.ready == 'true' && env.AI_PROVIDER == 'ollama'
        continue-on-error: true # if this fails, the gate falls back to hard checks
        uses: ./.github/actions/setup-ollama
        with:
          model: ${{ env.OLLAMA_MODEL }}

      - name: AI health check
        id: health
        if: steps.platform.outputs.ready == 'true'
        continue-on-error: true
        working-directory: scripts/ai
        env:
          BEDROCK_MODEL_ID: ${{ vars.BEDROCK_MODEL_ID }}
        run: |
          pip install -q -r requirements.txt
          python health_check.py --namespace "$NAMESPACE" --release "$RELEASE" --url "$APP_URL" \
            --rollout-status "${{ steps.helm.outcome }}"

      - name: Upload health report
        if: always() && steps.platform.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: health-report
          path: scripts/ai/health-report.json
          if-no-files-found: ignore

      - name: Roll back unhealthy release
        if: steps.health.outcome == 'failure'
        run: |
          REVISIONS="$(helm history "$RELEASE" -n "$NAMESPACE" -o json | jq length)"
          if [ "$REVISIONS" -gt 1 ]; then
            helm rollback "$RELEASE" 0 -n "$NAMESPACE" --wait --timeout 5m
            echo "### ↩️ Rolled back to the previous release" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ⚠️ First release is unhealthy and there is nothing to roll back to" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 1

      - name: Deployment summary
        if: steps.health.outcome == 'success'
        run: |
          {
            echo "### 🚀 Deployed \`$IMAGE_TAG\` to $CLOUD"
            echo "Application URL: $APP_URL"
          } >> "$GITHUB_STEP_SUMMARY"
